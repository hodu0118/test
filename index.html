<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noobis</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-pro-webfont@latest/neodgm_pro/style.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at top left, #343b70, transparent 35% ),
        radial-gradient(circle at bottom right, #47305d, transparent 35%),
        #111827;

      color: white;
      font-family: "NeoDunggeunmo Pro", sans-serif;
    }

    .card {
      width: min(90%, 600px);
      padding: 50px 40px;
      text-align: center;

      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
    }

    .logo {
      color: #ffe66d;
      font-size: 20px;
      letter-spacing: 4px;
    }

    h1 {
      margin: 24px 0 16px;
      color: #ffe66d;
      font-size: clamp(36px, 8vw, 72px);
      line-height: 1.1;
      text-shadow: 3px 3px 0 #806b28;
    }

    p {
      color: #d4d8e8;
      font-size: 19px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 24px;

      color: #171923;
      background: #ffe66d;
      text-decoration: none;
      border-radius: 12px;

      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-4px);
      background: white;
      box-shadow: 0 10px 25px rgba(255, 230, 109, 0.3);
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">NOOBIS HOSTING</div>

    <h1>Noobis란,  
혁신이다.</h1>

    <p>
      Noobis Hosting 고객님, 안녕하세요?  

      더 빠르고 편리한 호스팅을 경험해 보세요.
    </p>

    <a class="button" href="https://discord.com">
      Discord 바로가기 →
    </a>
  </main>
</body>
</html>
